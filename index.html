<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente | TerçaCost</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="TerçaCost">
        </div>
        <div class="header-right">
            <button class="notification">
                <i class="fa-solid fa-bell"></i>
            </button>
            <div class="user">
                <img src="img/usericon.png" alt="Usuário">
                <div>
                    <strong id="user-name">João Silva</strong>
                    <span>Cliente</span>
                </div>
                <button onclick="logout()"
                    style="background: none; border: none; color: #ef4444; margin-left: 10px; cursor: pointer;">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="welcome">
            <h1>Olá, João!</h1>
            <p>Bem-vindo à área do cliente. Aqui você acompanha seus projetos.</p>
        </section>

        <section class="new-project">
            <button class="new-project-btn" onclick="novoProjeto()">
                <span class="icon"><i class="fa-solid fa-plus"></i></span>
                <span>Novo Projeto</span>
            </button>
        </section>

        <section class="projects">
            <div class="title">
                <h2>Meus Projetos</h2>
                <button id="toggleView">Ver todos</button>
            </div>

            <div class="carousel">
                <button class="nav prev" id="prev">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <!-- Cleared static items: JavaScript will populate this -->
                <div class="project-grid" id="projectGrid"></div>

                <button class="nav next" id="next">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
