<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Novo Projeto | TerçaCost</title>

<link rel="stylesheet" href="/css/novoprojeto.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>

<header>

    <img src="img/logoHeader.png" class="logo">

    <div class="user">
        <i class="fa-solid fa-circle-user"></i>
    </div>

</header>



<div class="page">

<aside class="sidebar">
    <h2>Novo Projeto</h2>
    <p>Informe os dados da estrutura.</p>

    <div class="input-group">
        <label>Nome do Projeto</label>
        <input type="text" id="descricao" placeholder="Residência Silva">
    </div>

    <!-- FORMATO DO PERFIL -->
    <div class="input-group">
        <label>Tipo de Perfil</label>
        <select id="tipoPerfil" onchange="gerenciarCamposTela()" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            <option value="C">Perfil C (U Enrijecido)</option>
            <option value="U">Perfil U (Simples)</option>
            <option value="Z">Perfil Z (Z Enrijecido)</option>
        </select>
    </div>

    <!-- GEOMETRIA DO PERFIL (mm) -->
    <div class="input-group">
        <label>Altura da Alma - h (mm)</label>
        <input type="number" step="0.01" id="alturaAlma" value="300.0">
    </div>
    <div class="input-group">
        <label>Largura da Aba - b (mm)</label>
        <input type="number" step="0.01" id="larguraAba" value="85.0">
    </div>
    <div class="input-group" id="grupoEnrijecedor">
        <label>Aba do Enrijecedor - d (mm)</label>
        <input type="number" step="0.01" id="larguraEnrijecedor" value="25.0">
    </div>
    <div class="input-group">
        <label>Espessura da Chapa - t (mm)</label>
        <input type="number" step="0.01" id="espessuraChapa" value="4.75">
    </div>

    <!-- MATERIAL (Valores fixos padrão) -->
    <div class="input-group">
        <label>Escoamento do Aço - fy (MPa)</label>
        <input type="number" id="fy" value="300.0">
    </div>
    <input type="hidden" id="fu" value="400.0">
    <input type="hidden" id="E" value="200000.0">
    <input type="hidden" id="G" value="77000.0">

    <!-- NOVOS CAMPOS: CARREGAMENTO DA COBERTURA (Substituem o MSD e VSD antigos) -->
    <div class="input-group">
        <label>Carga Permanente (Telhas + Peso) (kg/m²)</label>
        <input type="number" id="cargaPermanente" value="15.0" step="0.1">
    </div>
    <div class="input-group">
        <label>Sobrecarga de Utilização (kg/m²)</label>
        <input type="number" id="sobrecarga" value="25.0" step="0.1">
    </div>
    <div class="input-group">
        <label>Pressão de Vento (Atuante) (kg/m²)</label>
        <input type="number" id="vento" value="45.0" step="0.1">
    </div>

    <!-- NOVOS CAMPOS: COMPRIMENTO E INTEREIXO DA OBRA -->
    <div class="input-group">
        <label>Espaçamento entre Terças - s (m)</label>
        <input type="number" step="0.01" id="espacamento" value="1.50">
    </div>
    <div class="input-group">
        <label>Vão Livre da Terça - L (m)</label>
        <input type="number" step="0.01" id="vao" value="6.00">
    </div>

    <!-- PARÂMETROS DE CONTENÇÃO -->
    <div class="input-group">
        <label>Contenção Lateral - Lb (mm)</label>
        <input type="number" step="0.1" id="lb" value="1500.0">
    </div>
    <div class="input-group">
        <label>Coeficiente Cb</label>
        <input type="number" step="0.001" id="cb" value="2.381">
    </div>



<input type="hidden" id="msd" value="0.0">
<input type="hidden" id="vsd" value="0.0">


    <!-- BOTÕES DE AÇÃO -->
    <button type="button" onclick="calcularEVerificar()" style="background-color: #4b5563; margin-bottom: 10px;">
        <i class="fa-solid fa-calculator"></i> Calcular Perfil
    </button>

    <button id="calculate">
        <i class="fa-solid fa-floppy-disk"></i> Salvar Projeto
    </button>
</aside>




    <main class="preview">

        <div class="beam-card">

            <img src="img/PlantaTerca.png">

        </div>

        <div class="result">

            <h3>Resultado</h3>

            <p id="result">
                Preencha os campos e clique em calcular.
            </p>


                <!-- NOVO BOTÃO: Abre o diagnóstico -->
    <div style="margin-top: 20px; text-align: left;">
        <button type="button" id="btnDiagnostico" onclick="abrirModalDiagnostico()" style="background-color: #1e293b; color: white; display: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; width: auto; cursor: pointer;">
            <i class="fa-solid fa-terminal"></i> Ver Diagnóstico Técnico Completamente
        </button>
    </div>

    <!-- JANELA MODAL OCULTA (CSS embutido para facilitar) -->
    <div id="modalDiagnostico" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 650px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; animation: fadeIn 0.3s;">
            
            <h3 style="margin-top: 0; color: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
                <span><i class="fa-solid fa-square-poll-vertical"></i> Diagnóstico Técnico da Terça</span>
                <span onclick="fecharModalDiagnostico()" style="cursor: pointer; color: #94a3b8; font-size: 24px; line-height: 1;">&times;</span>
            </h3>

            <textarea readonly id="txtRelatorioModal" style="width: 100%; height: 300px; font-family: monospace; font-size: 13px; padding: 12px; border-radius: 4px; border: 1px solid #ccc; background: #1e293b; color: #f8fafc; resize: none; line-height: 1.5; margin-bottom: 15px;"></textarea>
            
            <button type="button" onclick="fecharModalDiagnostico()" style="background-color: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; float: right; cursor: pointer; width: auto;">
                Fechar Janela
            </button>
        </div>
    </div>
</div>


        </div>

    </main>

</div>

<script src="/js/novoprojeto.js"></script>

</body>
</html>
