<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Novo Projeto | TerçaCost</title>

<link rel="stylesheet" href="/css/novoprojeto.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>

<header>

    <img src="img/logoHeader.png" class="logo">

    <div class="user">
        <i class="fa-solid fa-circle-user"></i>
    </div>

</header>



<div class="page">

    <aside class="sidebar">

        <h2>Novo Projeto</h2>
        <p>Informe os dados da estrutura.</p>

<div class="input-group">
    <label>Nome do Projeto</label>
    <input type="text" id="descricao" placeholder="Residência Silva">
</div>

<div class="input-group">
    <label>Nome do Perfil</label>
    <input type="text" id="nomedoPerfil" placeholder="U150x50x2.5">
</div>

<div class="input-group">
    <label>MSD (kN·m)</label>
    <input type="number" step="0.01" id="msd" placeholder="0.00">
</div>

<div class="input-group">
    <label>VSD (kN)</label>
    <input type="number" step="0.01" id="vsd" placeholder="0.00">
</div>

<div class="input-group">
    <label>Lb (m)</label>
    <input type="number" step="0.01" id="lb" placeholder="0.00">
</div>

<div class="input-group">
    <label>Cb</label>
    <input type="number" step="0.01" id="cb" placeholder="1.00">
</div>

<button id="calculate">
    <i class="fa-solid fa-floppy-disk"></i>
    Salvar Projeto
</button>

    </aside>

    <main class="preview">

        <div class="beam-card">

            <img src="img/PlantaTerca.png">

        </div>

        <div class="result">

            <h3>Resultado</h3>

            <p id="result">
                Preencha os campos e clique em calcular.
            </p>

        </div>

    </main>

</div>

<script src="/js/novoprojeto.js"></script>

</body>
</html>
